{% extends "base.html" %}

{% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/admin/admin_dashboard.css') }}"
/>
{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Admin Dashboard</h1>
    <div class="card-container">
        <div class="card">
            <a href="{{ url_for('admin.list_users') }}">
                <i class="fa fa-users"></i>
                <h2>Manage Users</h2>
            </a>
        </div>
        <div class="card">
            <a href="{{ url_for('admin.manage_products') }}">
                <i class="fa fa-box"></i>
                <h2>Manage Products</h2>
            </a>
        </div>
        <div class="card">
            <a href="{{ url_for('home') }}">
                <i class="fa fa-clipboard-list"></i>
                <h2>Manage Orders</h2>
            </a>
        </div>
        <div class="card">
            <a href="{{ url_for('home') }}">
                <i class="fa fa-chart-line"></i>
                <h2>Analytics</h2>
            </a>
        </div>
    </div>
</div>
{% endblock %}
