{% extends "base.html" %}

{% block css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/forget_password.css') }}"
/>
{% endblock %}

{% block content %}
<div class="forget-password-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="f_box">
                    <center><h2>Reset Password</h2></center>
                    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                        <div class="mb-3">
                            <label for="password" class="form-label">New Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your new password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your new password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Reset Password</button>
                        <a href="{{ url_for('login') }}" class="btn btn-primary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
